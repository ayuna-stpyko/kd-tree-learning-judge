# ジャッジの設定。config.ini にコピーして編集する (start.sh が無ければ自動でコピーする)。
# config.ini は .gitignore 済み。

[server]
# 待ち受けるアドレス。10.24 側のインターフェースのアドレスにする (例: 10.24.0.10)。
# 0.0.0.0 にした場合も、下の allowed_networks 以外からの接続は拒否する。
host = 0.0.0.0
port = 8000
# 接続を許可するネットワーク (カンマ区切り)
allowed_networks = 10.24.0.0/16, 127.0.0.0/8

[judge]
# docker: 本番用 (サンドボックスで隔離して PyPy で実行)
# local : 開発用 (隔離なし。このマシンの python3 などで直接実行する)
backend = docker
image = kdjudge-sandbox
# 実行に使うインタプリタ (docker ならコンテナ内のコマンド)
interpreter = pypy3
# ワーカーごとに固定する CPU コア。個数 = ワーカー数
worker_cpus = 2, 3
# 受け付ける問題のディレクトリ (カンマ区切り)。problem.json の ranked が true の問題 (ちょうど 1 つ) だけが
# 順位表に載る。ほかは判定だけ返す練習問題 (提出のカードには出る)。
problems = problems/kdtree-nn, problems/nn-1d, problems/nn-2d-l1
# 同じ名前で続けて提出できるまでの秒数
rate_limit_seconds = 30
max_source_bytes = 65536
